    - id: 81550596-c428-985b-8130-d556cb1a642c
      title: NASM re-encoda [abs 0x2+rax*2] como [rax+rax+0x2] (split) - usar nosplit
      description: 'Em SIB-abs (base ausente, SIB base=101) o endereco e disp32+index*scale. O NASM PREFERE a forma splitada quando index*2 == base+index com o MESMO registrador (so scale 2), encurtando a instrucao: [abs 0x2+rax*2] monta 8D 44 00 02 (4 B) em vez de 8D 04 45 02 00 00 00 (7 B) => bytes diferentes. Solucao: nosplit na expressao. Em x64 abs vem PRIMEIRO ([nosplit abs 0x10+rcx*4]); [rcx*4+abs 0x10] e expression syntax error. Em x32 nao ha abs ([nosplit 0x40A000+eax*4]). O disp32 e obrigatorio nessa forma (nunca cai em db por disp==0).'
      type: lesson
      severity: medium
      files: []
      branch: master
      tags: []
