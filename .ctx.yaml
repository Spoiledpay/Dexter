decisions:
    - id: 488d9016-78d3-4bce-b6ef-bc1981fca9a2
      title: 'D-22: entry label via equ no -s + -r'
      description: ""
      decision: Emitir label_<entryVA> equ label_<secVA> + 0x<delta> no fim do .asm quando -r e -s != secao do entry (win64/win32); delta 0 e -s na secao do entry nao emitem.
      rationale: Preserva o contrato de -s (nao forca a secao do entry a virar codigo), evita forward reference (equ no fim), nao toca -m bin e evita duplicata/auto-referencia.
      alternatives:
        - Forcar a secao do entry a code-walk com -r (muda escopo de -s); recusar -s + -r com exit 1 (quebra uso legitimo); emitir label no stream db em duas partes (duplica logica plain/chunks/uw/bss).
      files:
        - src/gen/rebuild.asm
      participants: []
      date: 2026-10-19T00:00:00Z
      status: accepted
      confidence: 1
      last_verified: 2026-10-19T18:34:27.5649363-03:00
      tags: []
      related:
        - 1dc75508-2227-3f3d-a945-7edd3690fcbd
      created_by: human
    - id: f4775b76-7d2f-4e5d-a7c3-d0f0c9500e8a
      title: 'D-19 2b: import table simbolica no win64 -native'
      description: ""
      decision: Reusar o walker de eventos do bin (.gb_db_slots) no win64 com grafia por modo (dd label wrt ..imagebase; thunk de 8B como dd label, 0), gaps via .wds_chunks/.wds_gap_win e selecao por .imp_sec_has; -s/-no-imports seguem db.
      rationale: O link reordena/funde secoes; RVAs absolutas do .idata copiado apontavam para o layout antigo. Reusar o walker evita duplicar F1-F4 e mantem bin/win64 consistentes. O linker recalcula as RVAs via relocacoes ADDR32NB.
      alternatives:
        - walker dedicado no win64; RVA absoluta com pos-patch no .exe; congelar layout com /FIXED
      files:
        - src/gen/rebuild.asm
        - docs/adr/0003-win64-import-table-simbolica.md
      participants: []
      date: 2026-10-21T00:00:00Z
      status: accepted
      confidence: 1
      last_verified: 2026-10-21T08:49:20.5041779-03:00
      tags: []
      created_by: human
