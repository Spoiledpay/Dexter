    - id: ea8ef06b-167b-0609-62bb-41f6d8e4cd6b
      title: SIB base sao os bits 2-0 (shr 5 le bits 7-5) e driver de teste linka emit_nasm sem rebuild
      description: 'Duas armadilhas da fatia do indice simbolico x32. (1) O campo base do byte SIB sao os BITS 2-0; extrai-lo com shr 5 (bits 7-5) faz o check base==101 nunca casar -> a VA nao entra no R e o operando sai numerico em SILENCIO (sem erro). SIB=0x85 (eax*4 sem base) -> base = 0x85 & 7 = 5. (2) O driver codegen_check ([12]) linka emit_nasm.obj SEM rebuild.obj: qualquer extern de FUNCAO novo no emissor (ou global no rebuild) quebra o link da suite. Solucao: o emissor DEFINE os globais de dados (g_abs_vas/g_abs_n/g_abs_base, 0=desligado) e o rebuild so escreve; o emissor consulta localmente.'
