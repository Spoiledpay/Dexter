memories:
    - id: 2ecde199-d6a3-ca7f-1b8e-29a27bf49033
      title: 'D-20: codegen nativo byte-fiel em PE MS (encoding load/store + segmento)'
      description: 'MSVC usa a forma load (8B/33/...) p/ ALU/mov reg-reg; o NASM canoniza p/ store (89/31) -> db p/ byte-fidelidade. Prefixo de segmento (gs:/fs:) era descartado nos caminhos sem base ([abs]/[rel]) -> reemitir [<seg>:...] (.fo_segpre). Prova: notepad -m bin -native fc/b=0.'
      type: lesson
      severity: medium
      files:
        - src/disasm/emit_nasm.asm
      branch: master
      tags:
        - disasm
        - byte-identity
      author: Dexter Engineer
      created_at: 2026-10-16T21:40:41.2281887-03:00
      updated_at: 2026-10-16T21:40:41.2281887-03:00
      confidence: 1
      last_verified: 2026-10-16T21:40:41.1155017-03:00
      created_by: human
    - id: 4fe41842-8699-103a-e110-84e3eea89aca
      title: ctx scan nao respeita .gitignore p/ arquivos avulsos; artefatos gerados gigantes explodem o indice
      description: 'tests/ld.lld.asm (734 MB gerado) estava versionado e gerou indice de 3 GB no ctx. Fix: git rm --cached + .gitignore. O ctx ignora dirs out/obj/bin por nome; manter dumps em tests/out/.'
      type: lesson
      severity: medium
      files:
        - tests/ld.lld.asm
        - .gitignore
      branch: master
      tags:
        - ctx
        - hygiene
      author: Dexter Engineer
      created_at: 2026-10-16T21:40:41.4554048-03:00
      updated_at: 2026-10-16T21:40:41.4554048-03:00
      confidence: 1
      last_verified: 2026-10-16T21:40:41.3465519-03:00
      created_by: human
    - id: aefdb615-da04-136d-3489-4a68199ceb57
      title: Scanner de eventos de 1 VA/iteracao orfana alvo registrado dentro do teste do slot
      description: 'Em .gb_db_slots (rebuild.asm) o scanner resolve apenas o MENOR VA candidato por iteracao. Ao registrar o label do alvo (hint/name) dentro do mesmo teste de secao/floor do slot do thunk, o alvo nunca era redescoberto depois de o slot ja ter sido emitido (slot < floor) => label_ orfao e ''symbol not defined'' no nasm. Correcao: o alvo e testado independente do slot (bloco .gbs_th_tgt). Regra: TODO evento precisa ser redescoberto em qualquer iteracao, so em funcao de floor.'
      type: lesson
      severity: medium
      files: []
      branch: master
      tags: []
      author: Dexter Engineer
      created_at: 2026-10-17T10:35:49.2997882-03:00
      updated_at: 2026-10-17T10:35:49.2997882-03:00
      confidence: 1
