name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + fast test suite (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Add NASM to PATH
        shell: pwsh
        run: |
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Toolchain
        shell: cmd
        run: |
          nasm -v
          where link.exe
          echo SDK_LIB=%LIB%

      - name: Python test dependency
        run: python -m pip install --disable-pip-version-check capstone

      - name: Build
        shell: cmd
        run: build.bat

      - name: Fast test suite
        shell: cmd
        env:
          DEXTER_SKIP_LARGE: "1"
        run: tests\run_tests.bat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexter-windows-x64
          path: |
            out/dexter.exe
            out/dexter.map
            tests/out/*.log
          if-no-files-found: ignore
